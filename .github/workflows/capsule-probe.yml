name: capsule-probe
# Throwaway proof that the data capsule can be mounted on a GitHub Windows runner.
# Never touches the tunnel, RDP or sshd, so it cannot interfere with a live machine.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CST_S3_AKID: ${{ secrets.CST_S3_AKID }}
      CST_S3_AKSEC: ${{ secrets.CST_S3_AKSEC }}
    steps:
      - name: probe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $work = $env:RUNNER_TEMP + '\cap'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Write-Host ('akid_len=' + ('' + $env:CST_S3_AKID).Trim().Length + ' aksec_len=' + ('' + $env:CST_S3_AKSEC).Trim().Length)
          $zip = Join-Path $work 'rc.zip'
          try {
            Invoke-WebRequest 'https://downloads.rclone.org/rclone-current-windows-amd64.zip' -OutFile $zip -UseBasicParsing -TimeoutSec 300
            Write-Host ('rc_zip=' + (Get-Item $zip).Length)
          } catch { Write-Host 'rc_zip=FAIL' }
          try { Expand-Archive $zip -DestinationPath $work -Force } catch { Write-Host 'rc_unzip=FAIL' }
          $rc = (Get-ChildItem $work -Recurse -Filter rclone.exe | Select-Object -First 1).FullName
          Write-Host ('rc_found=' + [bool]$rc)
          if ($rc) { (& $rc version | Select-Object -First 1) }
          $msi = Join-Path $work 'winfsp.msi'
          try {
            Invoke-WebRequest 'https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.23075.msi' -OutFile $msi -UseBasicParsing -TimeoutSec 300
            Write-Host ('wf_msi=' + (Get-Item $msi).Length)
          } catch { Write-Host 'wf_msi=FAIL' }
          $p = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          Write-Host ('wf_msiexec=' + $p.ExitCode)
          Write-Host ('wf_dll=' + (Test-Path (Join-Path $env:ProgramFiles 'WinFsp\bin\winfsp-x64.dll')))
          $conf = Join-Path $work 'cap.conf'
          $lines = @()
          $lines += '[capsule]'
          $lines += 'type = s3'
          $lines += 'provider = Other'
          $lines += 'env_auth = false'
          $lines += ('access_key_id = ' + $env:CST_S3_AKID)
          $lines += ('secret_access_key = ' + $env:CST_S3_AKSEC)
          $lines += 'endpoint = s3.cstcloud.cn'
          $lines += 'addressing_style = path'
          Set-Content -Path $conf -Value ($lines -join "`r`n") -Encoding ascii
          Write-Host '--- api listing (no mount) ---'
          (& $rc --config $conf lsf 'capsule:github' --max-depth 1 2>&1 | Select-Object -First 8)
          Write-Host '--- mount Z: ---'
          $logf = Join-Path $work 'mount.log'
          Start-Process -FilePath $rc -ArgumentList @('--config', $conf, 'mount', 'capsule:github', 'Z:', '--no-console', '--volname', 'capsule', '--vfs-cache-mode', 'writes', '--dir-cache-time', '10s', '--log-level', 'INFO', '--log-file', $logf) -WindowStyle Hidden
          $seen = $false
          for ($i = 0; $i -lt 30; $i++) {
            if (Test-Path 'Z:\') { $seen = $true; break }
            Start-Sleep -Seconds 2
          }
          Write-Host ('mount_seen=' + $seen)
          if ($seen) {
            (Get-ChildItem 'Z:\' -EA SilentlyContinue | Select-Object -First 6 | ForEach-Object { Write-Host ('entry=' + $_.Name) })
            $probe = Join-Path 'Z:\' 'zz-probe.txt'
            Set-Content -Path $probe -Value ('probe ' + (Get-Date).ToString('s')) -Encoding ascii
            Write-Host ('write_back=' + (Test-Path $probe))
            (& $rc --config $conf lsf 'capsule:github/zz-probe.txt' 2>&1 | Select-Object -First 3)
            Remove-Item $probe -Force -EA SilentlyContinue
          }
          Write-Host '--- mount log tail ---'
          if (Test-Path $logf) { (Get-Content $logf -Tail 12 -EA SilentlyContinue | ForEach-Object { Write-Host ('log: ' + $_) }) }
