name: linuxd

# Ubuntu browser terminal + desktop inside a free GitHub-hosted VM. Kept deliberately thin: every real
# step lives in linux/boot.sh, because a workflow step may not exceed GitHub's 21000-character
# expression limit and a run past it fails before any job exists.
#
# Same connection scheme as winterm on purpose -- the SAME named tunnel and the SAME hostnames
# (ssh.kun9.ccwu.cc, rdp.kun9.ccwu.cc). Only one of the two machines ever runs, so a hostname always
# resolves to whichever box is alive and nothing can be connected to the wrong machine.
#
# No new secrets: WT_TUNNEL_TOKEN is the connector, WT_RDP_PASS is the password for SSH (runner/root)
# and for the RDP desktop, CST_S3_* mount the capsule's github bucket under ~/capsule.
#
# Power works exactly like the Windows box: `schedule` is the only Actions trigger that fires without
# a token, so this 5-minute watchdog asks the panel /api/claim?m=linux whether a start is queued. The
# Worker refuses to hand out a start while a heartbeat is fresh or a run is live -- on either machine,
# because the two share one runner budget and one set of hostnames.

on:
  push:
    paths:
      - trigger.linuxd
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.claim.outputs.go }}
    steps:
      - id: claim
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "manual start (push/dispatch), no claim needed"
            echo "go=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          r=$(curl -s --max-time 20 'https://ctl.kun9.ccwu.cc/api/claim?m=linux' || true)
          echo "claim says: $r"
          case "$r" in
            *'"action":"start"'*) echo "go=yes" >> "$GITHUB_OUTPUT" ;;
            *) echo "go=no" >> "$GITHUB_OUTPUT" ;;
          esac

  linuxd:
    needs: wake
    if: needs.wake.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Open the Linux terminal
        shell: bash
        env:
          WT_TUNNEL_TOKEN: ${{ secrets.WT_TUNNEL_TOKEN }}
          WT_RDP_PASS: ${{ secrets.WT_RDP_PASS }}
          CST_S3_AKID: ${{ secrets.CST_S3_AKID }}
          CST_S3_AKSEC: ${{ secrets.CST_S3_AKSEC }}
        run: |
          echo "token_len=${#WT_TUNNEL_TOKEN} pass_len=${#WT_RDP_PASS} cap_len=${#CST_S3_AKID}"
          chmod +x linux/boot.sh
          bash linux/boot.sh
          echo "boot.sh returned $?"
