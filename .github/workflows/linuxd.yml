name: linuxd

# Ubuntu browser terminal + desktop inside a free GitHub-hosted VM. Kept deliberately thin: every real
# step lives in linux/boot.sh, because a workflow step may not exceed GitHub's 21000-character
# expression limit and a run past it fails before any job exists.
#
# Same connection scheme as winterm on purpose -- the SAME named tunnel and the SAME hostnames
# (ssh.kun9.ccwu.cc, rdp.kun9.ccwu.cc). Only one of the two machines ever runs, so a hostname always
# resolves to whichever box is alive and nothing can be connected to the wrong machine.
#
# Secrets: WT_TUNNEL_TOKEN is the connector, WT_RDP_PASS is the password for SSH (runner/root) and for
# the VNC desktop. CST_S3_AKSEC is not storage here -- it is passed in only as the second factor of the
# debug channel's HMAC key. GD_TOKEN is the Google Drive OAuth blob that boot.sh turns into an rclone
# config, so the drive is the one thing on this box that outlives a run.
#
# POWERING THIS MACHINE FROM THE WEB PANEL -- ONE PATH
# ------------------------------------------------------------
# 开机 makes the Worker POST workflow_dispatch to this file, so a runner starts the moment the button
# is pressed; editing trigger.linuxd boots the same box for the same reason. Stopping is the mirror
# image: boot.sh polls /api/power and ends its own run when the panel asks for it, which releases the
# runner. Nothing is scheduled, so no job runs around the clock waiting for a request.
# The Worker dispatches only when no heartbeat of either box is fresh and no run of either workflow is
# live -- the two share one runner budget and one set of hostnames, so they can never overlap.

on:
  push:
    paths:
      - trigger.linuxd
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  linuxd:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Open the Linux terminal
        shell: bash
        env:
          WT_TUNNEL_TOKEN: ${{ secrets.WT_TUNNEL_TOKEN }}
          WT_RDP_PASS: ${{ secrets.WT_RDP_PASS }}
          CST_S3_AKSEC: ${{ secrets.CST_S3_AKSEC }}
          GD_TOKEN: ${{ secrets.GD_TOKEN }}
        run: |
          echo "token_len=${#WT_TUNNEL_TOKEN} pass_len=${#WT_RDP_PASS} dbgkey_len=${#CST_S3_AKSEC} drive_len=${#GD_TOKEN}"
          chmod +x linux/boot.sh
          bash linux/boot.sh
          echo "boot.sh returned $?"
