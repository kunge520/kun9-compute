name: winterm

# Windows browser console inside a free GitHub-hosted VM (public repo = the runners cost no
# minutes). Every real step of the design, including the hard-won rules, lives in winterm/boot.ps1
# -- a workflow step may not be longer than GitHub's 21000-character expression limit, and the
# script blew straight past it (the run then fails before any job exists, the workflow is listed by
# path only, and the reason is visible just in the API error: "failed to parse workflow: Exceeded
# max expression length 21000"). So keep this file thin and put logic in the repo.
#
# The named-tunnel token and the fixed console login are repository Actions secrets
# (WT_TUNNEL_TOKEN, WT_RDP_PASS -- the second name predates the change, it is the single fixed
#  password for BOTH browser surfaces now: clientless RDP and clientless SSH, same credential),
# so a fresh VM is reachable in the browser the moment it boots: nothing has to be handed in from
# another machine first, and a start triggered by anyone -- including a schedule -- works.
#
# POWERING THE MACHINE FROM THE WEB PANEL, WITH NO CREDENTIAL ANYWHERE
# ------------------------------------------------------------
# `schedule` is the only Actions trigger that fires without a token, so the panel does not start
# the VM: it puts a request in the Worker's KV and this 5-minute watchdog asks the panel
# (POST /api/claim) whether one is queued. "start" -> the Windows job runs; anything else -> the
# job finishes in a few seconds and GitHub bills nothing. The Worker refuses to hand out a start
# while a heartbeat is fresh or a run is still live, so two machines can never overlap.
# Stopping is the mirror image: the panel queues a stop, boot.ps1 reads it on its next heartbeat
# and exits, which releases the runner. /api/claim and /api/power are deliberately the only
# unauthenticated endpoints, and neither reveals anything.

on:
  push:
    paths:
      - trigger.winterm
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.claim.outputs.go }}
    steps:
      - id: claim
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "manual start (push/dispatch), no claim needed"
            echo "go=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          r=$(curl -s --max-time 20 https://ctl.kun9.ccwu.cc/api/claim || true)
          echo "claim says: $r"
          case "$r" in
            *'"action":"start"'*) echo "go=yes" >> "$GITHUB_OUTPUT" ;;
            *) echo "go=no" >> "$GITHUB_OUTPUT" ;;
          esac

  winterm:
    needs: wake
    if: needs.wake.outputs.go == 'yes'
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Open the Windows terminal
        shell: powershell
        env:
          WT_TUNNEL_TOKEN: ${{ secrets.WT_TUNNEL_TOKEN }}
          WT_RDP_PASS: ${{ secrets.WT_RDP_PASS }}
        run: |
          Write-Host ('token_len=' + $env:WT_TUNNEL_TOKEN.Length + ' pass_len=' + $env:WT_RDP_PASS.Length)
          & .\winterm\boot.ps1
          Write-Host ('boot.ps1 returned ' + $LASTEXITCODE)
