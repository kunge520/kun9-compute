name: winterm

# Windows browser console inside a free GitHub-hosted VM (public repo = the runners cost no
# minutes). Every real step of the design, including the hard-won rules, lives in winterm/boot.ps1
# -- a workflow step may not be longer than GitHub's 21000-character expression limit, and the
# script blew straight past it (the run then fails before any job exists, the workflow is listed by
# path only, and the reason is visible just in the API error: "failed to parse workflow: Exceeded
# max expression length 21000"). So keep this file thin and put logic in the repo.
#
# The named-tunnel token and the fixed console login are repository Actions secrets
# (WT_TUNNEL_TOKEN, WT_RDP_PASS -- the second name predates the change, it is the single fixed
#  password for BOTH browser surfaces now: clientless RDP and clientless SSH, same credential),
# so a fresh VM is reachable in the browser the moment it boots: nothing has to be handed in from
# another machine first, and a start triggered from the panel or by a push works the same way.
# CST_S3_AKSEC is not storage here -- nothing is mounted any more, and it is passed in only as the
# second factor of the debug channel's HMAC key.
#
# POWERING THIS MACHINE FROM THE WEB PANEL -- ONE PATH
# ------------------------------------------------------------
# 开机 makes the Worker POST workflow_dispatch to this file, so a runner starts the moment the button
# is pressed; editing trigger.winterm boots the same box for the same reason. Stopping is the mirror
# image: boot.ps1 polls /api/power and ends its own run when the panel asks for it, which releases the
# runner. Nothing is scheduled, so no job runs around the clock waiting for a request.
# The Worker dispatches only when no heartbeat of either box is fresh and no run of either workflow is
# live -- the two share one runner budget and one set of hostnames, so they can never overlap.
# /api/power is deliberately unauthenticated and answers nothing a runner could abuse.

on:
  push:
    paths:
      - trigger.winterm
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  winterm:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Open the Windows terminal
        shell: powershell
        env:
          WT_TUNNEL_TOKEN: ${{ secrets.WT_TUNNEL_TOKEN }}
          WT_RDP_PASS: ${{ secrets.WT_RDP_PASS }}
          CST_S3_AKSEC: ${{ secrets.CST_S3_AKSEC }}
        run: |
          Write-Host ('token_len=' + $env:WT_TUNNEL_TOKEN.Length + ' pass_len=' + $env:WT_RDP_PASS.Length)
          & .\winterm\boot.ps1
          Write-Host ('boot.ps1 returned ' + $LASTEXITCODE)
