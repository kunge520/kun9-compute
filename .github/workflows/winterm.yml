name: winterm

# Windows browser terminal + Remote Desktop inside a free GitHub-hosted VM (public repo = the
# runners cost no minutes). Every real step of the design, including the hard-won rules, lives in
# winterm/boot.ps1 -- a workflow step may not be longer than GitHub's 21000-character expression
# limit, and the script blew straight past it (the run then fails before any job exists, the
# workflow is listed by path only, and the reason is visible just in the API error:
# "failed to parse workflow: Exceeded max expression length 21000"). So keep this file thin and
# put logic in the repo.
#
# The named-tunnel token and the login the user asked to keep fixed are repository Actions secrets
# (WT_TUNNEL_TOKEN, WT_RDP_PASS), so a fresh VM configures itself at boot: nothing has to be handed
# in from another machine first, and a start triggered by anyone -- including a schedule -- works.
# WT_TS_KEY is the Tailscale pre-auth key (reusable, expires after 90 days) that puts the VM straight
# into the tailnet, which is now the only way Remote Desktop reaches it; boot.ps1 skips that whole
# section when the secret is empty and says so in the heartbeat, so an old checkout still boots the
# same way it always did.

on:
  push:
    paths:
      - trigger.winterm
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  winterm:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Open the Windows terminal
        shell: powershell
        env:
          WT_TUNNEL_TOKEN: ${{ secrets.WT_TUNNEL_TOKEN }}
          WT_RDP_PASS: ${{ secrets.WT_RDP_PASS }}
          WT_TS_KEY: ${{ secrets.WT_TS_KEY }}
        run: |
          Write-Host ('token_len=' + $env:WT_TUNNEL_TOKEN.Length + ' pass_len=' + $env:WT_RDP_PASS.Length + ' ts_key_len=' + $env:WT_TS_KEY.Length)
          & .\winterm\boot.ps1
          Write-Host ('boot.ps1 returned ' + $LASTEXITCODE)
